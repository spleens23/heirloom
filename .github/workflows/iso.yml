# Turns the latest Heirloom image into an installer ISO.
# Run it from the Actions tab ("Build installer ISO" → "Run workflow").
# When it finishes, download the ISO from the run's "Artifacts" section.
name: Build installer ISO

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/heirloom:latest

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Make room on the build machine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Fetch the Heirloom image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull "$IMAGE"

      - name: Build the ISO
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "$PWD/disk_config/iso.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type anaconda-iso \
            --rootfs btrfs \
            --use-librepo=True \
            "$IMAGE"
          sudo chown -R "$(id -u):$(id -g)" output
          # Find the ISO wherever the builder put it, and give it a clear name.
          iso="$(find output -name '*.iso' -print -quit)"
          test -n "$iso" || { echo "No ISO was produced"; find output; exit 1; }
          mv "$iso" "output/heirloom-$(date -u +%Y%m%d).iso"
          sha256sum output/*.iso | tee output/SHA256SUMS
          ls -lh output

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: heirloom-installer
          path: |
            output/*.iso
            output/SHA256SUMS
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
