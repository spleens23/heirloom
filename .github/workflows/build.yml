# Builds the Heirloom system image and publishes it to GitHub's container
# registry. Installed Heirloom machines get their updates from here.
name: Build Heirloom

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "screenshots/**"]
  schedule:
    - cron: "17 7 * * *"   # daily, so Fedora fixes and yt-dlp stay fresh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/heirloom

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Make room on the build machine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5

      - name: Build the image
        run: |
          set +e
          # A version like 44.20261027 shows in Software Update and Settings.
          version="$(grep -oP 'FEDORA_VERSION=\K[0-9]+' Containerfile | head -1).$(date -u +%Y%m%d)"
          podman build --pull=newer \
            --label "version=$version" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$(date -u +%Y%m%d)" \
            . 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Show the end of the log as one error note on the run's summary
            # page, so the cause is visible without digging through the log.
            msg="$(tail -n 60 build.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Image build failed::${msg}"
          fi
          exit "$status"

      - name: Publish the image
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          podman push "$IMAGE:latest"
          podman push "$IMAGE:$(date -u +%Y%m%d)"

      - name: Check the image is public
        if: github.event_name != 'pull_request'
        run: |
          # Installed machines download updates without a password, so the
          # image must be public on GitHub's container registry.
          podman logout ghcr.io || true
          if skopeo inspect --no-creds "docker://$IMAGE:latest" > /dev/null 2>&1; then
            echo "::notice title=Image is public::Heirloom machines can download updates."
          else
            echo "::warning title=Image is private::Make the 'heirloom' package public: github.com/${{ github.repository_owner }}?tab=packages → heirloom → Package settings → Change visibility → Public."
          fi
