<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Parlor app icon: an original glossy tile with a record half out of its sleeve. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ecfd"/><stop offset="0.5" stop-color="#8cc4ef"/><stop offset="1" stop-color="#3f84bd"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3a4654"/><stop offset="0.6" stop-color="#1a222b"/><stop offset="1" stop-color="#0d1218"/>
    </radialGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d7e6f3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b2e4f" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tile)" stroke="#2f6c9f" stroke-width="3"/>
  <g filter="url(#shadow)">
    <circle cx="150" cy="128" r="68" fill="url(#vinyl)"/>
    <circle cx="150" cy="128" r="54" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="150" cy="128" r="42" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M112 84 q24 -14 56 -6" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
    <circle cx="150" cy="128" r="22" fill="#5fa6de"/>
    <circle cx="150" cy="128" r="4" fill="#0d1218"/>
    <rect x="40" y="62" width="132" height="132" rx="6" fill="url(#sleeve)" stroke="#1f3f5c" stroke-width="6"/>
    <path d="M92 152 V100 L128 92 V142" fill="none" stroke="#3f84bd" stroke-width="8" stroke-linejoin="round"/>
    <ellipse cx="84" cy="153" rx="12" ry="9" fill="#3f84bd"/>
    <ellipse cx="120" cy="143" rx="12" ry="9" fill="#3f84bd"/>
  </g>
  <path d="M15 64 Q15 15 64 15 H192 Q241 15 241 64 V112 Q128 140 15 112 Z" fill="url(#gloss)"/>
</svg>
