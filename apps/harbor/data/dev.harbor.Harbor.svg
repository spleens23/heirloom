<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Harbor app icon: an original glossy tile with a little lighthouse
       casting light over calm water. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ecfd"/>
      <stop offset="0.55" stop-color="#8cc4ef"/>
      <stop offset="1" stop-color="#3f84bd"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff8d6" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b2e4f" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tile)" stroke="#2f6c9f" stroke-width="3"/>
  <!-- light beams -->
  <path d="M134 86 L236 56 L236 116 Z" fill="url(#beam)"/>
  <path d="M122 86 L20 56 L20 116 Z" fill="url(#beam)" transform="matrix(-1 0 0 1 256 0) translate(0 0)" opacity="0.6"/>
  <!-- water -->
  <path d="M15 176 q28 -10 56 0 t56 0 t56 0 t56 0 V230 Q241 241 210 241 H46 Q15 241 15 210 Z" fill="#2f6c9f" opacity="0.85"/>
  <path d="M15 196 q28 -10 56 0 t56 0 t56 0 t56 0" fill="none" stroke="#bfe0fa" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <g filter="url(#shadow)">
    <!-- tower -->
    <path d="M110 178 L116 98 H140 L146 178 Z" fill="#ffffff" stroke="#1f3f5c" stroke-width="5" stroke-linejoin="round"/>
    <path d="M113 140 H143 L145 158 H111 Z" fill="#d0423a"/>
    <path d="M115 112 H141 L142 124 H114 Z" fill="#d0423a"/>
    <!-- lamp room -->
    <rect x="114" y="74" width="28" height="24" rx="4" fill="#fff3b8" stroke="#1f3f5c" stroke-width="5"/>
    <path d="M108 74 L128 56 L148 74 Z" fill="#d0423a" stroke="#1f3f5c" stroke-width="5" stroke-linejoin="round"/>
    <rect x="104" y="174" width="48" height="10" rx="4" fill="#1f3f5c"/>
  </g>
  <path d="M15 64 Q15 15 64 15 H192 Q241 15 241 64 V100 Q128 128 15 100 Z" fill="url(#gloss)"/>
</svg>
