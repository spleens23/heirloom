<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Spectacle app icon: an original glossy tile with a pair of round
       glasses, one lens holding a play triangle. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6ecfd"/>
      <stop offset="0.5" stop-color="#8cc4ef"/>
      <stop offset="1" stop-color="#3f84bd"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcebf7"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0b2e4f" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#tile)" stroke="#2f6c9f" stroke-width="3"/>
  <g filter="url(#shadow)">
    <!-- bridge and arms -->
    <path d="M110 120 q18 -16 36 0" fill="none" stroke="#1f3f5c" stroke-width="10" stroke-linecap="round"/>
    <path d="M36 112 l14 -4 M220 112 l-14 -4" stroke="#1f3f5c" stroke-width="10" stroke-linecap="round"/>
    <!-- lenses -->
    <circle cx="81" cy="136" r="38" fill="url(#lens)" stroke="#1f3f5c" stroke-width="10"/>
    <circle cx="175" cy="136" r="38" fill="url(#lens)" stroke="#1f3f5c" stroke-width="10"/>
    <!-- play triangle in the right lens -->
    <path d="M163 117 L196 136 L163 155 Z" fill="#3f8acb"/>
    <!-- lens glints -->
    <path d="M60 124 q8 -14 24 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M15 64 Q15 15 64 15 H192 Q241 15 241 64 V112 Q128 140 15 112 Z" fill="url(#gloss)"/>
</svg>
